<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Azulan · Campaign images and Meta ads for product brands</title>
<meta name="description" content="Azulan makes campaign images and Meta static ads for independent product brands.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Inter Tight";src:url(inter-tight-latin.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Instrument Serif";src:url(instrument-serif-normal-latin.woff2) format("woff2");font-style:normal;font-display:swap}
@font-face{font-family:"Instrument Serif";src:url(instrument-serif-italic-latin.woff2) format("woff2");font-style:italic;font-display:swap}
:root{--ink:#0A211F;--cream:#F7F9F2;--lime:#D8FF85;--mint:#8DFDBA;--forest:#2A4E45;--lineL:rgba(247,249,242,.16);
--sans:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Instrument Serif",Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--cream)}
body{font:400 18px/26px var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
.wrap{width:100%;max-width:1264px;margin:0 auto;padding:0 40px}
header{border-bottom:1px solid var(--lineL)}
.bar{height:78px;display:flex;align-items:center;justify-content:space-between}
.logo{font:500 26px/1 var(--sans);letter-spacing:-.6px;text-decoration:none;display:inline-flex;align-items:flex-start}
.dot{width:7px;height:7px;border-radius:50%;background:var(--lime);margin:2px 0 0 3px}
.mail{font-size:15px;text-decoration:none;opacity:.8}
.mail:hover{opacity:1;text-decoration:underline;text-underline-offset:4px}
main{flex:1;display:flex;align-items:center;padding:56px 0 84px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,480px);gap:96px;align-items:center}
.eyebrow{font-size:13px;line-height:16px;text-transform:uppercase;letter-spacing:1.6px;opacity:.7;margin:0 0 28px}
h1{font-weight:400;font-size:68px;line-height:74px;letter-spacing:-.6px;margin:0 0 28px;color:var(--mint)}
h1 em{font-family:var(--serif);font-style:italic;letter-spacing:0;color:var(--cream)}
.sub{font-size:20px;line-height:30px;opacity:.82;max-width:470px;margin:0}
.btn{display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 28px;margin-top:44px;border-radius:999px;background:var(--lime);color:var(--ink);font:600 15px/1 var(--sans);text-decoration:none;transition:box-shadow .15s}
.btn:hover{box-shadow:0 0 0 5px rgba(216,255,133,.25)}
.btn svg{width:14px;height:14px}
.strip{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.strip figure{margin:0;border-radius:14px;overflow:hidden;background:var(--forest);aspect-ratio:4/5;box-shadow:0 24px 48px -24px rgba(0,0,0,.55)}
.strip figure:nth-child(2n){transform:translateY(28px)}
.strip figure:nth-child(-n+2){margin-top:-28px}
.strip img{display:block;width:100%;height:100%;object-fit:cover}
footer{border-top:1px solid var(--lineL);font-size:14px}
.foot{height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;opacity:.7}
.foot a{text-decoration:none}.foot a:hover{text-decoration:underline;text-underline-offset:4px}
@media (max-width:1100px){h1{font-size:56px;line-height:62px}.hero{gap:48px}}
@media (max-width:860px){
 .wrap{padding:0 22px}
 main{padding:48px 0 64px;align-items:flex-start}
 .hero{grid-template-columns:1fr;gap:48px}
 h1{font-size:44px;line-height:48px;letter-spacing:-.4px;margin-bottom:20px}
 .eyebrow{margin-bottom:20px;font-size:12px}
 .sub{font-size:18px;line-height:27px}
 .btn{margin-top:32px;width:100%;justify-content:center}
 .strip{gap:10px}
 .strip figure{border-radius:12px}
 .strip figure:nth-child(2n){transform:translateY(20px)}
 .strip figure:nth-child(-n+2){margin-top:0}
 .mail{font-size:14px}
 .foot{height:auto;padding-top:22px;padding-bottom:22px;flex-direction:column;align-items:flex-start;gap:6px}
}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="logo" href="https://azulan.com" aria-label="Azulan">Azulan<span class="dot"></span></a>
  <a class="mail" href="mailto:admin@getazulan.com">admin@getazulan.com</a>
</div></header>
<main><div class="wrap hero">
  <div>
    <p class="eyebrow">Creative studio</p>
    <h1>Campaign images and Meta ads <em>for independent product brands.</em></h1>
    <p class="sub">Static ads and campaign images, with the copy to run them, made from the products you already sell.</p>
    <a class="btn" href="https://azulan.com">See our work at azulan.com <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11L11 3M5 3h6v6"/></svg></a>
  </div>
  <div class="strip" aria-label="Selected work">
    <figure><img src="ad75-720.webp" width="720" height="900" alt="Native ad: Heath Ceramics dinnerware styled as a saved Pinterest pin"></figure>
    <figure><img src="ad46b-720.webp" width="720" height="900" alt="Static ad: Wild One Cushioned Dog Harness on a whippet, “Less pull. More walk.”"></figure>
    <figure><img src="ad43-720.webp" width="720" height="900" alt="Static ad: East Fork speckled mugs on travertine, “Made to be used every day.”"></figure>
    <figure><img src="ad32-720.webp" width="720" height="900" alt="Native ad: Parachute bedding recommended in a WhatsApp group chat"></figure>
  </div>
</div></main>
<footer><div class="wrap foot">
  <span>© 2026 Azulan</span>
  <span>Contact: <a href="mailto:admin@getazulan.com">admin@getazulan.com</a> · <a href="https://azulan.com">azulan.com</a></span>
</div></footer>
</body>
</html>
